name: Tag release

# When a new app version reaches main, create its annotated vX.Y.Z tag automatically.
# A manual run can recover a missed push event without moving the tag to a later docs commit.
# (AI assistants working through the GitHub connector cannot create tags themselves.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag if this version has none yet
        run: |
          version=$(grep -o 'app-version" content="[^"]*"' index.html | cut -d'"' -f3)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "No valid app-version found in index.html; nothing to tag."
            exit 0
          fi
          tag="v$version"
          # Walk only main's first-parent history to find the merge that introduced this version.
          # Follow-up documentation commits must not become the release tag target.
          release_sha="$GITHUB_SHA"
          while parent=$(git rev-parse "${release_sha}^" 2>/dev/null); do
            parent_version=$(git show "$parent:index.html" 2>/dev/null | sed -n 's/.*name="app-version" content="\([^"]*\)".*/\1/p' | head -1)
            if [ "$parent_version" != "$version" ]; then break; fi
            release_sha="$parent"
          done
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$release_sha"
          git push origin "$tag"
          echo "Created $tag at $release_sha"
