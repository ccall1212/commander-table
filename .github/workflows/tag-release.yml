name: Tag release

# When a new app version reaches main, create its annotated vX.Y.Z tag automatically.
# (AI assistants working through the GitHub connector cannot create tags themselves.)
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag if this version has none yet
        run: |
          version=$(grep -o 'app-version" content="[^"]*"' index.html | cut -d'"' -f3)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "No valid app-version found in index.html; nothing to tag."
            exit 0
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "Created $tag at $GITHUB_SHA"
