name: Tests

# Runs the quick automatic checks on every pull request and on every push to main,
# so a broken change is noticed before it is published. It only reads the code.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checks
        run: bash tests/run_checks.sh
